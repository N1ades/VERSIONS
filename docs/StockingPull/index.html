<html lang="en">
<head>
<meta charset="utf-8">

<link rel="alternate" hreflang="en" href="https://n1ades.github.io/VERSIONS/StockingPull/en/"><link rel="alternate" hreflang="ja" href="https://nyades.booth.pm/items/9219429"><link rel="alternate" hreflang="ko" href="https://n1ades.github.io/VERSIONS/StockingPull/ko/"><link rel="alternate" hreflang="ru" href="https://n1ades.github.io/VERSIONS/StockingPull/ru/">
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #222; --muted: #757575; --line: #e5e5e5; --accent: #fc4d50; --accent-hover: #e8383b; --link: #0096fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --card: #202227; --text: #e8e8ea; --muted: #9a9ca3; --line: #33353c; --link: #5cb8ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.8 "Segoe UI", "Hiragino Kaku Gothic ProN", "Malgun Gothic", Meiryo, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 700; font-size: 15px; margin-right: auto; white-space: nowrap; }
  .langs { display: flex; gap: 2px; font-size: 13px; flex-wrap: wrap; }
  .langs a, .langs span { padding: 4px 8px; border-radius: 4px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .langs span { color: var(--text); background: var(--bg); font-weight: 600; }
  .langs a:hover { color: var(--text); }
  .booth { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: 6px; white-space: nowrap; }
  .booth:hover { background: var(--accent-hover); }
  .booth.large { font-size: 15px; padding: 12px 22px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  .card { background: var(--card); border-radius: 6px; padding: 24px; margin-bottom: 16px; }
  h1 { font-size: 22px; line-height: 1.5; margin: 0 0 12px; }
  .hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .price { color: var(--accent); font-size: 20px; font-weight: 700; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  h2 { font-size: 18px; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  a { color: var(--link); }
  .video { position: relative; aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; background: #000; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .back { text-align: center; }
  .back p { margin: 0 0 12px; color: var(--muted); }
  @media (max-width: 560px) { .brand { display: none; } .bar-inner { justify-content: space-between; } .bar .booth { padding: 8px 10px; } }

  .text { overflow-wrap: break-word; }
  @media(max-width:560px) { .bar-inner {flex-wrap:wrap;} .langs {flex:1;} .card {padding:20px;} }

  h3 { font-size: 15px; margin: 20px 0 6px; }
  h3:first-of-type { margin-top: 0; }

  .text + .text { margin-top: 12px; }
  .card ul, .card ol { padding-left: 1.5em; margin: 0; }
  .card li + li { margin-top: 6px; }
  .availability { color: var(--muted); margin: 12px 0 0; }
</style>
</head>

</section></main></body>
</html>
